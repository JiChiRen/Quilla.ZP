# Quilla.ZP application configuration.

# ---- Console / Quilla APP shell -------------------------------------------
# The console UART is chosen in app/boards/gd/gd32f502ve_quilla/*.dts; it is
# USART0 / PB6-PB7 / 115200, the same wiring QBOOT uses on this board.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# The Quilla host updater probes with a bare "part" line and matches "app1"
# in the reply. A plain prompt keeps the line parser free of ANSI escapes.
CONFIG_SHELL_PROMPT_UART="> "
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_HISTORY=n

# ---- Flash driver (META record writer) ------------------------------------
CONFIG_FLASH=y

# ---- GPIO / LED heart-beat -------------------------------------------------
CONFIG_GPIO=y

# ---- Boot handover ---------------------------------------------------------
# Quilla QBOOT owns the boot policy. The APP vector table must be at
# 0x08007000 exactly (QBOOT reads MSP/reset from there and sets VTOR), so
# link with an explicit flash offset and reserve no image header.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_ROM_START_OFFSET=0
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x7000
CONFIG_FLASH_LOAD_SIZE=0x79000
# The QAV1 linker snippet is injected via snippets-rom-start.ld, which is
# consumed by the LD template path (the CMake linker generator does not
# include it). Pin the template so the section cannot silently disappear.
CONFIG_LD_LINKER_TEMPLATE=y

# ---- Runtime ---------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
# sys_reboot() is only compiled when CONFIG_REBOOT is set (lib/os/Kconfig).
CONFIG_REBOOT=y
CONFIG_LOG=n
